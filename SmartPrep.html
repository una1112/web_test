function status(item){if(item.qty<item.min)return {text:'庫存偏低',kind:'bad'};if(item.expires<=3)return {text:'即將到期',kind:'warn'};return {text:'庫存正常',kind:'good'}}

function dateShift(dateString,delta){const d=new Date(dateString+'T12:00:00');d.setDate(d.getDate()+delta);return fmtLocal(d)}

// 用固定算式建立過去 100 天的假資料；同一份資料跨所有頁面使用。
function generateSales(){let rows=[];for(let offset=99;offset>=0;offset--){const date=dateShift(fmtLocal(today),-offset), dow=new Date(date+'T12:00:00').getDay(),factor=dow===6||dow===0?1.22:dow===5?1.11:dow===1?.91:1;MENU.forEach((m,j)=>{const season=1+.12*Math.sin((99-offset)*.49+j*.87),variation=1+.10*Math.sin((99-offset)*1.37+j*2.1),promo=(offset%17===0&&j<3)?1.22:1;rows.push({date,id:m.id,qty:Math.max(0,Math.round(m.base*factor*season*variation*promo))})})}return rows}

function rowsForDays(days,end=fmtLocal(today)){const start=dateShift(end,1-days);return salesRows.filter(x=>x.date>=start&&x.date<=end)}
function joinedRows(days,end,category='全部',term=''){return rowsForDays(days,end).filter(x=>{let m=MENU.find(m=>m.id===x.id);return m&&(category==='全部'||m.category===category)&&(!term||m.name.includes(term))})}
function aggregate(days,end=fmtLocal(today),category='全部',term=''){
const map=new Map();for(const s of joinedRows(days,end,category,term)){const m=MENU.find(m=>m.id===s.id);if(!map.has(s.id))map.set(s.id,{...m,qty:0,revenue:0});let it=map.get(s.id);it.qty+=s.qty;it.revenue+=s.qty*m.price}
return [...map.values()]}
function totals(rows){return {qty:rows.reduce((a,x)=>a+x.qty,0),revenue:rows.reduce((a,x)=>a+x.revenue,0)}}
function topMenu(days=7,end=fmtLocal(today)){return aggregate(days,end).sort((a,b)=>b.qty-a.qty)}
function quantityForDay(date){return totals(aggregate(1,date)).qty}
function seriesForDays(days,end=fmtLocal(today)){
const size=days===7?1:days===30?3:days===90?10:1;
let out=[];for(let start=days-1;start>=0;start-=size){let span=Math.min(size,start+1),periodEnd=dateShift(end,-start+span-1);let r=aggregate(span,periodEnd);out.push({label:span===1?dateLabel(periodEnd):dateLabel(dateShift(periodEnd,1-span)),qty:totals(r).qty,revenue:totals(r).revenue})}return out}
function bars(vals,labels,unit='件'){let W=640,H=235,max=Math.max(1,Math.ceil(Math.max(1,...vals)*1.12/20)*20),left=43,right=10,top=16,bottom=33,w=W-left-right,h=H-top-bottom;let g=[0,.25,.5,.75,1].map(fr=>{let y=top+h*(1-fr);return `<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#eaf0eb" stroke-dasharray="4 4"/><text class="chart-tick" x="${left-10}" y="${y+3}" text-anchor="end">${Math.round(max*fr)}</text>`}).join('');let b=vals.map((v,i)=>{let wid=Math.min(47,w/vals.length*.59),x=left+(i+.5)*w/vals.length-wid/2,hh=v/max*h;return `<rect x="${x}" y="${top+h-hh}" width="${wid}" height="${hh}" rx="5" fill="${i===vals.length-1?'#236b50':'#9dc7b0'}"/><text class="chart-tick" x="${x+wid/2}" y="${H-11}" text-anchor="middle">${labels[i]}</text>`}).join('');return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit}銷售趨勢圖">${g}${b}</svg></div>`}
function segmented(period,values,attr='data-home-period'){return `<div class="segmented" role="group" aria-label="選擇顯示期間">${values.map(([v,t])=>`<button class="segment ${String(period)===String(v)?'active':''}" ${attr}="${v}">${t}</button>`).join('')}</div>`}
function rankList(items,limit=5,action="salesDetail"){const list=items.slice(0,limit),max=Math.max(1,...list.map(x=>x.qty));return list.map((m,i)=>`<button class="rank-row" data-action="${action}" data-id="${m.id}"><span class="rank-number ${i===0?'gold':''}">${i+1}</span><span class="rank-detail"><span class="rank-line"><strong>${safe(m.name)}</strong><span>${format(m.qty)} ${menuUnit(m)}</span></span><span class="progress"><span style="width:${(m.qty/max*100).toFixed(1)}%"></span></span></span></button>`).join('')}
function overview(){const todayItems=aggregate(1),summary=totals(todayItems),orders=Math.round(aggregate(1).filter(x=>x.category==='主餐').reduce((a,x)=>a+x.qty,0)*.93),series=seriesForDays(Number(state.period)),miss=forecastLines().filter(x=>x.missing>0),alerts=state.inventory.filter(x=>status(x).kind!=='good').sort((a,b)=>a.expires-b.expires);

function dataSourcePanel(){return `<section class="card card-pad"><div class="card-title"><div><h3>資料來源與同步</h3><small>正式版本規劃支援 POS API 或定期匯入檔案</small></div><span class="chip ${state.posConnected?'good':'warn'}">${state.posConnected?'示範：已連接':'尚未連接 POS'}</span></div><div class="source-options"><div class="source-box"><span class="source-icon">${ic('refresh')}</span><div class="source-body"><strong>POS 收銀系統</strong><p>${state.posConnected?`模擬連線中 · 最近同步：${safe(state.lastSync||'尚未同步')}`:'尚未授權任何 POS，畫面使用內建虛構資料'}</p><div class="toolbar"><button class="btn small ${state.posConnected?'secondary':''}" data-action="${state.posConnected?'syncPos':'posDialog'}">${ic(state.posConnected?'refresh':'plus','tiny')} ${state.posConnected?'模擬同步':'設定 POS 連接'}</button>${state.posConnected?`<button class="btn ghost small" data-action="disconnectPos">解除模擬連線</button>`:''}</div></div></div><div class="source-box"><span class="source-icon">${ic('upload')}</span><div class="source-body"><strong>銷售資料匯入</strong><p>可從 POS 匯出 CSV；此離線版支援本機 CSV 預覽與套用示範。</p><div class="toolbar"><label for="salesUpload" class="btn secondary small upload-label">${ic('upload','tiny')} 選擇 CSV 檔案</label><input type="file" id="salesUpload" accept=".csv,text/csv,.xlsx,.xls" class="visually-hidden"><button class="btn ghost small" data-action="sampleCsv">${ic('download','tiny')} 下載範例格式</button></div></div></div></div>${state.uploadRows?`<div class="upload-preview"><div class="card-title"><div><h3>檔案預覽：${safe(state.uploadFileName)}</h3><small>解析 ${state.uploadRows.length} 筆資料，套用後更新本頁模擬銷售記錄</small></div><button class="btn small" data-action="applySalesImport">確認套用 ${ic('check','tiny')}</button></div><div class="table-scroll"><table><thead><tr><th>日期</th><th>品項</th><th>銷售數量</th></tr></thead><tbody>${state.uploadRows.slice(0,5).map(x=>`<tr><td>${x.date}</td><td>${safe(MENU.find(m=>m.id===x.id)?.name)}</td><td>${x.qty}</td></tr>`).join('')}</tbody></table></div></div>`:''}</section>`}

function dishes(){const end=dateShift(state.forecastDate,-1),last=dateShift(end,-27),targetDow=new Date(state.forecastDate+'T12:00:00').getDay(),factor=state.scenario==='rain'?.85:state.scenario==='event'?1.27:1;

<div class="grid4">${statCard('食材種類',state.inventory.length,'項','模擬食材庫存','package','')}${statCard('低庫存品項',countLow(),'項','低於安全存量','alert','orange')}${statCard('即將到期',state.inventory.filter(x=>x.expires<=3).length,'項','3 日內需留意','clock','red')}${statCard('庫存正常',state.inventory.filter(x=>status(x).kind==='good').length,'項','目前無警示','check-circle','blue')}</div><div class="gap18"></div>
<section class="card card-pad"><div class="inventory-toolbar"><div class="toolbar"><input class="search" id="stockSearch" value="${safe(state.term)}" placeholder="搜尋食材名稱..." aria-label="搜尋食材"/><select class="select" id="stockFilter" aria-label="篩選庫存">${['全部','庫存偏低','即將到期','庫存正常','肉品','蔬菜','乾貨','蛋類','調味','飲品原料','其他'].map(v=>`<option ${state.filter===v?'selected':''}>${v}</option>`).join('')}</select></div><button class="btn secondary small" data-action="exportStock">${ic('download')} 匯出 CSV</button></div><div class="table-scroll"><table><thead><tr><th>食材名稱</th><th>類別</th><th>目前庫存</th><th>安全存量</th><th>保存期限</th><th>庫存狀態</th><th class="align-right">操作</th></tr></thead><tbody>${filtered.length?filtered.map(x=>`<tr><td><div class="row-label"><span class="mini-icon">${ic(x.category==='肉品'?'package':'leaf','tiny')}</span><strong>${safe(x.name)}</strong></div></td><td>${safe(x.category)}</td><td><strong>${format(x.qty)} ${safe(x.unit)}</strong></td><td>${format(x.min)} ${safe(x.unit)}</td><td>${expiryDate(x.expires)}</td><td>${badge(status(x))}</td><td class="align-right"><button class="action-link" data-action="editItem" data-id="${x.id}">${ic('edit','tiny')} 編輯</button></td></tr>`).join(''):`<tr><td colspan="7" class="nodata">沒有符合條件的食材。</td></tr>`}</tbody></table></div></section><div class="gap18"></div><div class="banner">${ic('info')}<div><strong>食材與餐點關聯</strong><p>備料頁面會根據 ${MENU.length} 款餐點的示範配方換算食材需求；在本頁修改庫存後，會同步影響預測缺口。</p></div></div>${foot()}`}
function analytics(){let period=Number(state.period),series=seriesForDays(period),all=aggregate(period),ts=totals(all),prediction=series.map((s,i)=>Math.max(0,Math.round(s.qty*(.96+.055*Math.sin(i*1.8+.8))))),actual=series.map(s=>s.qty);return `<div class="page-intro"><div><h2>營運數據分析</h2><p>比較歷史銷量與概念性預測值，呈現未來可以追蹤的營運指標。</p></div>${segmented(state.period,[['7','近 7 天'],['30','近 30 天'],['90','近 90 天']],'data-period')}</div>
<div class="grid4">${statCard('期間銷售金額',money(ts.revenue),'','依模擬單價與銷量加總','cart','')}${statCard('期間售出商品',format(ts.qty),'件','包含 18 款餐點與飲品','clipboard','blue')}${statCard('銷售商品種類',all.filter(x=>x.qty>0).length,'款','依目前虛構菜單','package','')}${statCard('示範預測誤差','約 4.8','%','僅為概念示意，非經驗證模型','activity','orange')}</div><div class="gap18"></div><div class="split"><section class="card card-pad"><div class="card-title"><div><h3>模擬實際銷售 vs. 假設預測</h3><small>${period===7?'每日':`每 ${period===30?'3':'10'} 天`}合併為一組</small></div><div class="legend"><span><i class="first"></i>實際（模擬）</span><span><i class="second"></i>預測（假設）</span></div></div>${lines(actual,prediction,series.map(x=>x.label))}</section><section class="card card-pad"><div class="card-title"><h3>管理重點與下一步</h3><span class="chip">規劃功能</span></div><div class="banner">${ic('sparkles')}<div><strong>從熱銷排行延伸到食材需求</strong><p>以銷量預測熱門餐點的可能需求，再換算食材用量，有助店長提前安排備料。</p></div></div><div class="mini-divider"></div><div class="small-highlight">${ic('check-circle','tiny')} 追蹤熱門餐點的售罄情形</div><div class="mini-divider"></div><div class="small-highlight">${ic('check-circle','tiny')} 比較預測量與實際售出量</div><div class="mini-divider"></div><div class="small-highlight">${ic('check-circle','tiny')} 若要估算耗損，仍須紀錄食材報廢量</div></section></div><div class="gap18"></div><div class="split-even"><section class="card card-pad"><div class="card-title"><h3>品項熱銷排行</h3><span class="chip">${period} 天銷售量</span></div>${rankList(topMenu(period),7)}</section><section class="card card-pad"><div class="card-title"><h3>正式導入後可量測的指標</h3></div><ul class="bullets"><li>預測誤差：預測銷售數量與實際銷量差距</li><li>缺貨率：熱門餐點提早售罄的頻率</li><li>耗損率：報廢食材占總使用量的比例</li><li>備料工時：每天盤點與人工估算所需時間</li></ul><div style="margin-top:16px"><button class="btn secondary small" data-action="analyticsExplain">${ic('info')} 查看指標說明</button></div></section></div>${foot()}`}
function lines(a,b,labels){let W=640,H=244,left=42,right=14,top=23,bottom=31,max=Math.ceil(Math.max(1,...a,...b)*1.13/30)*30,w=W-left-right,h=H-top-bottom;let grid=[0,.25,.5,.75,1].map(fr=>{let y=top+h*(1-fr);return `<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#e8f0e8" stroke-dasharray="3 5"/><text class="chart-tick" x="${left-8}" y="${y+4}" text-anchor="end">${Math.round(max*fr)}</text>`}).join('');const pt=arr=>arr.map((v,i)=>`${left+i*w/Math.max(1,arr.length-1)},${top+h-v/max*h}`).join(' ');return `<div class="chart-wrap"><svg role="img" aria-label="模擬銷售與預測比較圖" viewBox="0 0 ${W} ${H}">${grid}<polyline points="${pt(b)}" fill="none" stroke="#bbdcca" stroke-width="3" stroke-dasharray="6 5"/><polyline points="${pt(a)}" fill="none" stroke="#278061" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${a.map((v,i)=>`<circle cx="${left+i*w/Math.max(1,a.length-1)}" cy="${top+h-v/max*h}" r="3.7" fill="#278061" stroke="white" stroke-width="2"/>`).join('')}${labels.map((label,i)=>`<text class="chart-tick" text-anchor="middle" x="${left+i*w/Math.max(1,labels.length-1)}" y="${H-9}">${label}</text>`).join('')}</svg></div>`}
function foot(){return `<div class="footer-note">SmartPrep © 互動式概念原型 · 全站為虛構餐廳及模擬數據 · 未連線真實 AI、POS 或資料庫</div>`}

function labelResponsiveTables(root){
 if(!root)return;
 root.querySelectorAll('.table-scroll table').forEach(table=>{
  const labels=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());
  table.querySelectorAll('tbody tr').forEach(row=>{
   [...row.children].forEach((cell,index)=>{
    if(cell.tagName==='TD' && !cell.hasAttribute('colspan'))cell.dataset.label=labels[index]||'';
   });
  });
 });
}
function render(){const nav=$('navigation');nav.innerHTML=PAGES.map(([id,n,ico])=>`<button class="nav-btn ${state.page===id?'active':''}" data-page="${id}">${ic(ico)}${n}</button>`).join('');$('pageTitle').textContent=PAGES.find(x=>x[0]===state.page)?.[1]||'營運總覽';$('crumb').textContent=$('pageTitle').textContent;$('currentDate').textContent=today.toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'});$('pageContent').innerHTML=({overview,sales,forecast,inventory,analytics}[state.page]||overview)();$('notifyDot').style.display=state.notifsRead?'none':'block';$('sidebar').classList.toggle('open',state.sidebarOpen);$('mobileOverlay').classList.toggle('open',state.sidebarOpen);renderNotif();labelResponsiveTables($('pageContent'))}

let toastTimeout;function toast(message){$('toastRoot').innerHTML=`<div class="toast">${ic('check-circle')}${safe(message)}</div>`;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('toastRoot').innerHTML='',3500)}
function modal(title,body,actions=''){state.notificationOpen=false;renderNotif();$('modalRoot').innerHTML=`<div class="shadow-cover" data-action="closeOnBackdrop"><div class="dialog" role="dialog" aria-modal="true" aria-label="${safe(title)}"><div class="dialog-head"><div><h2>${safe(title)}</h2><p>SmartPrep｜互動式概念原型</p></div><button class="close" data-action="closeModal" aria-label="關閉">${ic('x','tiny')}</button></div>${body}<div class="dialog-actions">${actions||`<button class="btn" data-action="closeModal">我知道了</button>`}</div></div></div>`;labelResponsiveTables($('modalRoot'))}

function settings(){modal('系統設定（Demo）',`<div class="form-grid"><div class="form-group"><label class="field-label">示範店家</label><input class="field" value="炙牛食堂" disabled></div><div class="form-group"><label class="field-label">商品數量</label><input class="field" value="${MENU.length} 款示範菜單" disabled></div><div class="form-group"><label class="field-label">銷售資料</label><input class="field" value="內建 100 天模擬資料" disabled></div><div class="form-group"><label class="field-label">POS 系統</label><input class="field" value="${state.posConnected?'模擬連線已啟用':'未連接'}" disabled></div></div><div class="banner" style="margin-top:18px">${ic('info')}<div><strong>成果發表概念版本</strong><p>正式產品需額外實作資料庫、權限管理、POS API、預測模型與資料驗證。</p></div></div>`)}

function renderNotif(){if(!state.notificationOpen){$('notifRoot').innerHTML='';return}let stock=state.inventory.filter(x=>status(x).kind!=='good');$('notifRoot').innerHTML=`<div class="notif-panel"><div class="card-title" style="margin-bottom:3px"><h3>系統通知</h3><button class="action-link" data-action="readNotifs">全部標記已讀</button></div><div class="notif-item"><strong>${ic('alert','tiny')} 庫存檢查提醒</strong><p>目前有 ${countLow()} 項食材低於安全存量。</p></div><div class="notif-item"><strong>${ic('clock','tiny')} 效期提醒</strong><p>${state.inventory.filter(x=>x.expires<=3).length} 項食材在 3 天內到期。</p></div><div class="notif-item"><strong>${ic('info','tiny')} 模擬資料</strong><p>此介面不會傳送通知給真實餐廳。</p></div></div>`}
function editItem(id){const x=state.inventory.find(x=>x.id===id);if(!x)return;const fields=`<div class="form-grid"><div class="form-group"><label class="field-label" for="itemName">食材名稱</label><input class="field" id="itemName" value="${safe(x.name)}" maxlength="26"></div><div class="form-group"><label class="field-label" for="itemCategory">類別</label><select class="select" id="itemCategory">${['肉品','蔬菜','乾貨','蛋類','調味','飲品原料','其他'].map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="form-group"><label class="field-label" for="itemQty">庫存數量</label><input class="field" id="itemQty" type="number" min="0" max="99999" step="0.01" value="${x.qty}"></div><div class="form-group"><label class="field-label" for="itemMin">安全存量</label><input class="field" id="itemMin" type="number" min="0" max="99999" step="0.01" value="${x.min}"></div><div class="form-group"><label class="field-label" for="itemUnit">單位</label><select class="select" id="itemUnit">${['kg','L','顆','包','瓶'].map(u=>`<option ${x.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="form-group"><label class="field-label" for="itemExpiry">距離到期天數</label><input class="field" id="itemExpiry" type="number" min="0" max="3650" step="1" value="${x.expires}"></div></div>`;modal(`編輯食材・${x.name}`,fields,`<button class="btn secondary" data-action="closeModal">取消</button><button class="btn" data-action="saveItem" data-id="${id}">儲存修改</button>`)}
function addItem(){const fields=`<div class="form-grid"><div class="form-group"><label class="field-label" for="itemName">食材名稱</label><input class="field" id="itemName" maxlength="26" placeholder="例如：高麗菜"></div><div class="form-group"><label class="field-label" for="itemCategory">類別</label><select class="select" id="itemCategory"><option>蔬菜</option><option>肉品</option><option>乾貨</option><option>蛋類</option><option>調味</option><option>飲品原料</option><option>其他</option></select></div><div class="form-group"><label class="field-label" for="itemQty">庫存數量</label><input class="field" id="itemQty" type="number" min="0" max="99999" step="0.01" value="3"></div><div class="form-group"><label class="field-label" for="itemMin">安全存量</label><input class="field" id="itemMin" type="number" min="0" max="99999" step="0.01" value="2"></div><div class="form-group"><label class="field-label" for="itemUnit">單位</label><select class="select" id="itemUnit"><option>kg</option><option>L</option><option>顆</option><option>包</option><option>瓶</option></select></div><div class="form-group"><label class="field-label" for="itemExpiry">距離到期天數</label><input class="field" id="itemExpiry" type="number" min="0" max="3650" step="1" value="7"></div></div>`;modal('新增示範食材',fields,`<button class="btn secondary" data-action="closeModal">取消</button><button class="btn" data-action="saveItem" data-id="new">加入庫存</button>`)}
function saveItem(id){let el=k=>$(k)?.value, name=String(el('itemName')||'').trim(),qty=Number(el('itemQty')),min=Number(el('itemMin')),expires=Number(el('itemExpiry'));if(!name||!Number.isFinite(qty)||!Number.isFinite(min)||!Number.isInteger(expires)||qty<0||min<0||expires<0||qty>99999||min>99999||expires>3650){toast('請確認食材名稱與數量填寫正確');return}if(id==='new'){state.inventory.push({id:Math.max(0,...state.inventory.map(x=>x.id))+1,name,qty,min,expires,category:el('itemCategory'),unit:el('itemUnit')})}else{let x=state.inventory.find(v=>v.id===Number(id));if(!x)return;Object.assign(x,{name,qty,min,expires,category:el('itemCategory'),unit:el('itemUnit')})}saveStock();closeModal();render();toast(id==='new'?'示範食材已新增':'模擬庫存已更新')}
function saveStock(){try{localStorage.setItem(STORAGE,JSON.stringify(state.inventory))}catch(e){}}
function download(name,rows){const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('示範 CSV 已下載')}
function exportStock(){download('SmartPrep_示範庫存.csv',[['食材','類別','目前庫存','單位','安全存量','距到期天數','狀態'],...state.inventory.map(x=>[x.name,x.category,x.qty,x.unit,x.min,x.expires,status(x).text])])}
function exportPurchases(){if(!state.forecastRan){toast('請先執行模擬預測');return}download('SmartPrep_模擬補貨建議.csv',[['食材','預估需求','目前庫存','模擬缺口','單位'],...forecastLines().filter(x=>x.missing>0).map(x=>[x.name,x.need,x.stock,x.missing,x.unit])])}
function importData(){modal('食材庫存匯入｜概念示意',`<p style="font-size:13px;line-height:1.8;color:#657b6d">這一頁目前支援新增與編輯食材，匯入功能尚未解析外部庫存檔案。</p><div class="banner" style="margin-top:14px">${ic('info')}<div><strong>銷售 CSV 上傳已可於「銷售數據管理」操作</strong><p>完整產品未來會支援 POS、食材進貨與盤點資料的同步。</p></div></div>`,`<button class="btn secondary" data-action="closeModal">關閉</button><button class="btn" data-page="sales">前往銷售數據管理</button>`)}
function explain(){modal('營運指標說明',`<ul class="bullets"><li><strong>銷售金額：</strong>以單價乘上模擬銷售數量加總，不含折扣及稅額的實際 POS 差異。</li><li><strong>預測誤差：</strong>正式系統應定義 MAPE、WAPE 等誤差公式，以保留資料驗證，畫面百分比僅供示意。</li><li><strong>耗損率：</strong>必須另外記錄報廢量與實際使用量，不能只根據 POS 銷售推算。</li></ul><div class="banner" style="margin-top:15px">${ic('info')}<div><strong>請勿將本版數據當成已驗證成效</strong><p>全部都是虛構或概念性數值，未經真實營運驗證。</p></div></div>`)}
function salesDetail(id){const m=MENU.find(x=>x.id===id);if(!m)return;const d=Number(state.page==='sales'?state.salesPeriod:state.page==='overview'?state.rankPeriod:state.period), end=state.page==='sales'?state.salesEnd:fmtLocal(today), row=aggregate(d,end).find(x=>x.id===id)||{qty:0,revenue:0};let timeline=rowsForDays(Math.min(d,7),end).filter(x=>x.id===id);modal(`商品銷售詳情｜${safe(m.name)}`,`<div class="two-metrics"><div><span>統計期間</span><strong>${d} 天</strong></div><div><span>商品類別</span><strong>${m.category}</strong></div><div><span>銷售數量</span><strong>${format(row.qty)} ${menuUnit(m)}</strong></div><div><span>銷售金額</span><strong>${money(row.revenue)}</strong></div></div><div style="margin-top:16px"><strong style="font-size:12px">近期每日銷售</strong>${bars(timeline.map(x=>x.qty),timeline.map(x=>dateLabel(x.date)),menuUnit(m))}</div><p class="hint">售價 ${money(m.price)} · 此處為虛構餐廳的模擬商品資料。</p>`)}
function forecastItemDetail(id){let m=MENU.find(x=>x.id===id),item=dishes().find(x=>x.id===id);if(!m||!item)return;let recipes=Object.entries(m.recipe).map(([name,amount])=>{let stock=state.inventory.find(s=>s.name===name),unit=stock?.unit||'kg';return `<tr><td><strong>${safe(name)}</strong></td><td>${format(amount)} ${unit}</td><td>${format(amount*item.count)} ${unit}</td></tr>`}).join('');modal(`預測與示範食譜｜${safe(m.name)}`,`<div class="two-metrics"><div><span>模擬預測日期</span><strong>${dateLabel(state.forecastDate)}</strong></div><div><span>建議準備</span><strong>${item.count} ${menuUnit(m)}</strong></div></div><div style="margin-top:16px"><div class="card-title"><h3>單件商品食材用量與建議準備需求</h3></div><div class="table-scroll"><table><thead><tr><th>食材</th><th>單件用量</th><th>建議總量</th></tr></thead><tbody>${recipes}</tbody></table></div></div><p class="hint">以上為簡化的虛構食譜，非實際餐廳配方。</p>`)}
function posDialog(){modal('連接 POS 系統｜展示流程',`<div class="form-grid"><div class="form-group"><label class="field-label">POS 系統</label><select class="select" disabled><option>示範 POS（虛構）</option></select></div><div class="form-group"><label class="field-label">同步範圍</label><select class="select" disabled><option>商品與每日銷售彙總</option></select></div></div><div class="banner" style="margin-top:16px">${ic('info')}<div><strong>僅模擬授權成功畫面</strong><p>不會連接外部服務，也不會讀取真實收銀資訊。正式版須針對特定 POS 品牌提供授權與 API 串接。</p></div></div>`,`<button class="btn secondary" data-action="closeModal">取消</button><button class="btn" data-action="connectPos">${ic('refresh','tiny')} 模擬完成連接</button>`)}
function sampleCsv(){const t=dateShift(fmtLocal(today),-1);download('SmartPrep_銷售匯入範例.csv',[['日期','品項','銷售數量'],...MENU.slice(0,8).map((m,i)=>[t,m.name,Math.max(1,Math.round(m.base*(i%2?1.1:.9)))])])}
function parseCsv(text){const records=[];let current=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else{quoted=!quoted}}else if(c===','&&!quoted){current.push(field.trim());field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;current.push(field.trim());field='';if(current.some(Boolean))records.push(current);current=[]}else{field+=c}}current.push(field.trim());if(current.some(Boolean))records.push(current);return records}
async function handleSalesFile(file){if(!file)return;state.uploadRows=null;state.uploadFileName='';if(!/\.csv$/i.test(file.name)){toast('此離線 Demo 目前只解析 CSV；Excel 請先另存 CSV');return}if(file.size>2*1024*1024){toast('示範檔案請小於 2 MB');return}try{const data=parseCsv((await file.text()).replace(/^\uFEFF/,'')),headers=data[0]||[],indices=['日期','品項','銷售數量'].map(x=>headers.indexOf(x));if(indices.some(i=>i<0)){toast('欄位需包含：日期、品項、銷售數量');return}let result=[];for(let row of data.slice(1)){let [date,name,q]=indices.map(i=>row[i]),m=MENU.find(x=>x.name===name);if(!m||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date||'')||Number.isNaN(Date.parse(date+'T12:00:00'))||!/^\d+$/.test(String(q))||Number(q)>99999){toast('有資料格式不符、未知品項或不合法數量，請使用範例 CSV');return}if(date>fmtLocal(today)||date<dateShift(fmtLocal(today),-99)){toast('日期需在最近 100 天內');return}result.push({date,id:m.id,qty:Number(q)})}if(!result.length){toast('CSV 沒有可匯入的資料');return}state.uploadRows=result;state.uploadFileName=file.name;render();toast(`已預覽 ${result.length} 筆 CSV 銷售資料`)}catch(e){toast('CSV 讀取失敗，請確認編碼與格式')}}
function applySalesImport(){if(!state.uploadRows)return;for(const r of state.uploadRows){let existing=salesRows.find(x=>x.date===r.date&&x.id===r.id);if(existing)existing.qty=r.qty;else salesRows.push({...r})}let n=state.uploadRows.length;state.uploadRows=null;state.uploadFileName='';render();toast(`已套用 ${n} 筆示範 CSV 資料（僅限本頁）`)}
function exportSales(){let items=aggregate(state.salesPeriod,state.salesEnd,state.salesCategory,state.salesTerm).sort((a,b)=>b.qty-a.qty);download('SmartPrep_品項銷售查詢.csv',[['期間結束日','查詢天數','商品編號','商品名稱','商品類別','單價','銷售數量','銷售單位','銷售金額'],...items.map(m=>[state.salesEnd,state.salesPeriod,m.id,m.name,m.category,m.price,m.qty,menuUnit(m),m.revenue])])}
// 全部按鈕使用事件委派，所有銷售與庫存操作都只改變這份離線 Demo 的本機狀態。
document.addEventListener('click',e=>{
 const trigger=e.target.closest('[data-page],[data-period],[data-home-period],[data-rank-period],[data-sales-period],[data-action]');if(!trigger)return;
 if(trigger.hasAttribute('data-page')){closeModal();goto(trigger.dataset.page);return}
 if(trigger.hasAttribute('data-home-period')){state.period=trigger.dataset.homePeriod;render();return}
  if(trigger.hasAttribute('data-rank-period')){state.rankPeriod=trigger.dataset.rankPeriod;render();return}
 if(trigger.hasAttribute('data-sales-period')){state.salesPeriod=Number(trigger.dataset.salesPeriod);render();return}
 if(trigger.hasAttribute('data-period')){state.period=trigger.dataset.period;render();return}
 const act=trigger.dataset.action;
 switch(act){
 case 'guide':guide();break;case 'startGuide':closeModal();goto('sales');break;
 case 'settings':settings();break;
 case 'storeSelect':modal('示範分店',`<p style="font-size:13px;line-height:1.8;color:#657b6d">目前只有「炙牛食堂・示範分店」。正式版可延伸多分店與個別 POS 同步。</p>`);break;
 case 'reset':resetConfirm();break;
 case 'resetConfirm':state.inventory=structuredClone(SEED);salesRows=generateSales();state.filter='全部';state.term='';state.scenario='normal';state.forecastDate=fmtLocal(tomorrow);state.forecastRan=true;state.notifsRead=false;state.period='7';state.rankPeriod='7';state.salesPeriod=7;state.salesEnd=fmtLocal(today);state.salesCategory='全部';state.salesTerm='';state.salesSort='quantity';state.posConnected=false;state.lastSync=null;state.uploadRows=null;state.uploadFileName='';saveStock();closeModal();goto('overview');toast('虛構銷售與庫存資料已重設');break;
 case 'notifications':state.notificationOpen=!state.notificationOpen;renderNotif();break;
 case 'readNotifs':state.notifsRead=true;state.notificationOpen=false;render();toast('通知已標記已讀');break;
 case 'mobileMenu':state.sidebarOpen=!state.sidebarOpen;render();break;
 case 'closeModal':closeModal();break;
 case 'closeOnBackdrop':if(e.target===trigger)closeModal();break;
 case 'predict':state.forecastRan=false;render();{const b=$('runForecast');if(b){b.disabled=true;b.innerHTML=ic('loader','spin')+' 正在產生模擬結果...'}}setTimeout(()=>{state.forecastRan=true;state.forecastRunCount++;render();toast('已更新規則模擬預測（未呼叫 AI）')},460);break;
 case 'jumpForecastList':$('forecastAll')?.scrollIntoView({behavior:'smooth',block:'start'});break;
 case 'addItem':addItem();break;case 'editItem':editItem(Number(trigger.dataset.id));break;case 'saveItem':saveItem(trigger.dataset.id);break;
 case 'import':importData();break;case 'demoImport':state.inventory=structuredClone(SEED);saveStock();closeModal();render();toast('已還原預設示範庫存');break;
 case 'exportStock':exportStock();break;case 'exportPurchases':exportPurchases();break;case 'analyticsExplain':explain();break;
 case 'salesDetail':salesDetail(trigger.dataset.id);break;
 case 'forecastItemDetail':forecastItemDetail(trigger.dataset.id);break;
 case 'posDialog':posDialog();break;
 case 'connectPos':state.posConnected=true;state.lastSync=today.toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'})+' (示範)';closeModal();render();toast('已啟用 POS 示範連線（非真實串接）');break;
 case 'disconnectPos':state.posConnected=false;state.lastSync=null;render();toast('已解除示範連線');break;
 case 'syncPos':state.lastSync=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+' (示範)';render();toast('已完成模擬同步；未連線外部 POS');break;
 case 'sampleCsv':sampleCsv();break;case 'applySalesImport':applySalesImport();break;case 'exportSales':exportSales();break;
 }
});
document.addEventListener('change',e=>{
 let id=e.target.id;
 if(id==='forecastDate'){state.forecastDate=e.target.value||fmtLocal(tomorrow);state.forecastRan=false;render()}
 if(id==='forecastScenario'){state.scenario=e.target.value;state.forecastRan=false;render()}
 if(id==='stockFilter'){state.filter=e.target.value;render()}
 if(id==='salesEnd'){state.salesEnd=e.target.value||fmtLocal(today);render()}
 if(id==='salesCategory'){state.salesCategory=e.target.value;render()}
 if(id==='salesSort'){state.salesSort=e.target.value;render()}
 if(id==='salesUpload'){handleSalesFile(e.target.files?.[0])}
});
document.addEventListener('input',e=>{
 if(e.target.id==='stockSearch'||e.target.id==='salesSearch'){
 const which=e.target.id==='stockSearch'?'term':'salesTerm',pos=e.target.selectionStart;
 state[which]=e.target.value;render();let input=$(e.target.id);if(input){input.focus();try{input.setSelectionRange(pos,pos)}catch(_){}}
 }
});
$('mobileOverlay').addEventListener('click',()=>{state.sidebarOpen=false;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();state.notificationOpen=false;state.sidebarOpen=false;render()}});
$('logoMark').innerHTML=ic('logo');replaceIcons(document);render();
})();
</script>
